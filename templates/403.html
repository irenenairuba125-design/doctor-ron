{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="card mx-auto text-center py-5 px-4" style="max-width: 520px;">
  <i class="bi bi-shield-lock text-danger" style="font-size: 4rem;"></i>
  <h1 class="h3 mt-3">Access denied</h1>
  <p class="text-muted">Your role ({{ user.get_role_display }}) does not have permission to view this page.</p>
  <a href="{% url 'core:dashboard' %}" class="btn btn-primary">Back to dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
  <div class="card login-card text-center p-5"><h1 class="h3">Access denied</h1><a href="/" class="btn btn-primary mt-2">Log in</a></div>
</div>
{% endblock %}
