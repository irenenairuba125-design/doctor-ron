{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger" style="max-width: 560px;">
  <div class="card-body p-4">
    <h1 class="h5 text-danger"><i class="bi bi-exclamation-triangle"></i> Delete {{ module.singular|lower }}</h1>
    <p>Are you sure you want to permanently delete <strong>{{ object }}</strong>? This cannot be undone.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger"><i class="bi bi-trash"></i> Yes, delete</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
