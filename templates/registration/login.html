{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
  <div class="card login-card" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-logo mx-auto"><i class="bi bi-hospital"></i></div>
        <h1 class="h4 mt-2 mb-0">Hospital Management System</h1>
        <p class="text-muted small">Sign in to continue</p>
      </div>
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2">{{ form.non_field_errors|join:" " }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
