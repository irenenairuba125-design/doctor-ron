{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <h1 class="h4 mb-3"><i class="bi bi-key"></i> Change password</h1>
    <form method="post">
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Update password</button>
    </form>
  </div>
</div>
{% endblock %}
